name: CI

on:
  push:
  pull_request:

jobs:
  # The API: type check, tests against a real database, and a check that
  # the compiled app loads
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway PostgreSQL database that exists only during this run,
    # with the pgvector extension the migrations need
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tollvakt_test
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test settings; in CI they come from here instead of .env.test
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tollvakt_test
      JWT_SECRET: ci_test_secret
      JWT_EXPIRES_IN: 1h

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Vitest runs the TypeScript files with its own compiler. This loads
      # the code compiled by tsc, so errors that only appear there fail the build.
      - name: Check that the compiled app loads
        run: node --input-type=module -e "await import('./dist/app.js')"

  # The ETL: unit tests, and import tests against a database whose schema
  # comes from the backend's migrations
  etl:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tollvakt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tollvakt_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tollvakt_test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Create the database schema with the backend's migrations
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm run migrate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install dependencies
        working-directory: etl
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: etl
        run: pytest
